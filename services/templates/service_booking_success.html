{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Success</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-card{
            background: #fff;
            border-radius: 25px;
            padding: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 550px;
            width: 100%;
        }

        .success-icon{
            width: 110px;
            height: 110px;
            background: #198754;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            font-size: 55px;
        }

        .btn-custom{
            border-radius: 12px;
            padding: 12px 25px;
            font-weight: 600;
        }

    </style>
</head>
<body>

    <div class="success-card">

        <div class="success-icon mb-4">
            <i class="bi bi-check-lg"></i>
        </div>

        <h2 class="fw-bold text-success">
            Service Booking Successful
        </h2>

        <p class="text-muted mt-3 mb-4">
            Your vehicle service request has been submitted successfully.
            Our mechanic will contact you soon.
        </p>

        <div class="d-flex justify-content-center gap-3">

            <a href="/" class="btn btn-success btn-custom">
                <i class="bi bi-house-door-fill"></i>
                Home
            </a>

            <a href="/service/servicebooking/" class="btn btn-outline-success btn-custom">
                <i class="bi bi-plus-circle"></i>
                New Booking
            </a>

        </div>

    </div>

</body>
</html>
