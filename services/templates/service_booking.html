{% extends 'base.html' %}

{% block header %}Service Booking{% endblock %}

{% block content %}

<style>

    body{
        background-color: #f5f5f5;
    }

    .booking-card{
        background: white;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0px 2px 15px rgba(0,0,0,0.1);
    }

    .heading{
        background: #0d6efd;
        color: white;
        padding: 20px;
        border-radius: 15px;
        text-align: center;
        margin-bottom: 30px;
    }

    .form-label{
        font-weight: bold;
    }

</style>

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="booking-card">

                <!-- Heading -->
                <div class="heading">

                    <h2>
                        <i class="bi bi-tools"></i>
                        Vehicle Service Booking
                    </h2>

                </div>


                <!-- Django Messages -->
                {% if messages %}

                    {% for message in messages %}

                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show">

                            {{ message }}

                            <button type="button"
                                    class="btn-close"
                                    data-bs-dismiss="alert">
                            </button>

                        </div>

                    {% endfor %}

                {% endif %}


                <!-- Form -->
                <form method="POST">

                    {% csrf_token %}

                    <!-- Vehicle -->
                    <div class="mb-3">

                        <label class="form-label">
                            Select Vehicle
                        </label>

                        <select name="vehicle"
                                class="form-select">

                            <option value="">
                                -- Select Vehicle --
                            </option>

                            {% for vehicle in vehicles %}

                                <option value="{{ vehicle.id }}">

                                    {{ vehicle.vehicle_name }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- City -->
                    <div class="mb-3">

                        <label class="form-label">
                            Select City
                        </label>

                        <select name="city"
                                class="form-select">

                            <option value="">
                                -- Select City --
                            </option>

                            {% for city in cities %}

                                <option value="{{ city.id }}">

                                    {{ city.name }}

                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- Complaints -->
                    <div class="mb-3">

                        <label class="form-label">
                            Select Complaints
                        </label>

                        <div class="row">

                            {% for complaint in complaints %}

                            <div class="col-md-6 mb-2">

                                <div class="form-check">

                                    <input class="form-check-input"
                                           type="checkbox"
                                           name="complaints"
                                           value="{{ complaint.id }}"
                                           id="complaint{{ complaint.id }}">

                                    <label class="form-check-label"
                                           for="complaint{{ complaint.id }}">

                                        {{ complaint.complaint_name }}

                                        -
                                        ₹{{ complaint.basic_sevice_price }}

                                    </label>

                                </div>

                            </div>

                            {% endfor %}

                        </div>

                    </div>


                    <!-- Problem Description -->
                    <div class="mb-3">

                        <label class="form-label">
                            Problem Description
                        </label>

                        <textarea name="problem_description"
                                  class="form-control"
                                  rows="4"
                                  placeholder="Enter problem description"></textarea>

                    </div>


                    <!-- Location -->
                    <div class="mb-4">

                        <label class="form-label">
                            Service Location
                        </label>

                        <textarea name="location"
                                  class="form-control"
                                  rows="3"
                                  placeholder="Enter your location"></textarea>

                    </div>


                    <!-- Submit -->
                    <div class="d-grid">

                        <button type="submit"
                                class="btn btn-primary btn-lg">

                            <i class="bi bi-check-circle"></i>

                            Book Service

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
