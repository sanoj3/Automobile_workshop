{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow border-0 rounded-4">

                <!-- Header -->
                <div class="card-header bg-primary text-white text-center py-4 rounded-top-4">

                    <h2 class="fw-bold mb-2">
                        Service Booking
                    </h2>

                    <p class="mb-0">
                        Book your vehicle service quickly
                    </p>

                </div>

                <!-- Form -->
                <div class="card-body p-4">

                    <form method="POST">

                        {% csrf_token %}

                        <!-- Vehicle Dropdown -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Vehicle
                            </label>

                            <select name="vehicle"
                                    class="form-select rounded-3"
                                    required>

                                <option value="">
                                    Select Vehicle
                                </option>

                                {% for v in vehicles %}
                                <option value="{{ v.id }}">
                                    {{ v.vehicle_name }}
                                </option>
                                {% endfor %}

                            </select>

                        </div>

                        <!-- City Dropdown -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                City
                            </label>

                            <select name="city"
                                    class="form-select rounded-3"
                                    required>

                                <option value="">
                                    Select City
                                </option>

                                {% for i in city %}
                                <option value="{{ i.name }}">
                                    {{ i.name }}
                                </option>
                                {% endfor %}

                            </select>

                        </div>

                        <!-- Complaints (Checkbox Multiple) -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Complaints
                            </label>

                            <div class="border rounded-3 p-3">

                                {% for c in complaints %}

                                <div class="form-check">

                                    <input class="form-check-input"
                                           type="checkbox"
                                           name="complaints"
                                           value="{{ c.name }}">

                                    <label class="form-check-label">
                                        {{ c.complaint_name }}
                                    </label>

                                </div>

                                {% endfor %}

                            </div>

                        </div>

                        <!-- Description -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Problem Description
                            </label>

                            <textarea name="problem_description"
                                      rows="5"
                                      class="form-control rounded-3"
                                      placeholder="Describe your problem..."
                                      required></textarea>

                        </div>

                        <!-- Submit -->
                        <div class="d-grid">

                            <button type="submit"
                                    class="btn btn-primary btn-lg rounded-3">

                                Book Service

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
