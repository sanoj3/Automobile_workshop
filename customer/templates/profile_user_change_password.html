{% extends 'base.html' %}

{% block title %}Change Password{% endblock %}
{% block header %}Change Password{% endblock %}

{% block content %}

<style>
    /* Animation Keyframes */
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    @keyframes scaleIn {
        from {
            opacity: 0;
            transform: scale(0.95);
        }
        to {
            opacity: 1;
            transform: scale(1);
        }
    }
    
    @keyframes pulse {
        0%, 100% {
            transform: scale(1);
            opacity: 0.4;
        }
        50% {
            transform: scale(1.05);
            opacity: 0.2;
        }
    }
    
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
    }
    
    .password-container {
        max-width: 500px;
        margin: auto;
        animation: fadeInUp 0.5s ease-out;
    }
    
    /* Main Card */
    .password-card {
        background: white;
        border-radius: 32px;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(106, 13, 173, 0.12);
        transition: all 0.3s ease;
        animation: scaleIn 0.5s ease-out;
    }
    
    .password-card:hover {
        box-shadow: 0 25px 50px rgba(106, 13, 173, 0.18);
    }
    
    /* Card Header - Purple Theme */
    .password-header {
        background: linear-gradient(135deg, #6c3483, #8e44ad, #a569bd);
        padding: 35px 30px;
        text-align: center;
        position: relative;
        overflow: hidden;
    }
    
    .password-header::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -20%;
        width: 250px;
        height: 250px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 50%;
        animation: pulse 8s ease-in-out infinite;
    }
    
    .password-header::after {
        content: '';
        position: absolute;
        bottom: -40%;
        left: -10%;
        width: 200px;
        height: 200px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 50%;
        animation: pulse 6s ease-in-out infinite reverse;
    }
    
    .lock-icon {
        width: 80px;
        height: 80px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 15px;
        position: relative;
        z-index: 1;
    }
    
    .lock-icon i {
        font-size: 40px;
        color: white;
    }
    
    .password-header h3 {
        color: white;
        font-weight: 800;
        margin-bottom: 8px;
        position: relative;
        z-index: 1;
    }
    
    .password-header p {
        color: rgba(255, 255, 255, 0.85);
        font-size: 14px;
        margin-bottom: 0;
        position: relative;
        z-index: 1;
    }
    
    /* Card Body */
    .password-body {
        padding: 35px;
    }
    
    /* Form Groups */
    .form-group-password {
        margin-bottom: 25px;
    }
    
    .input-wrapper-password {
        position: relative;
    }
    
    .input-icon-password {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: #9ca3af;
        font-size: 18px;
        transition: all 0.3s ease;
        z-index: 2;
    }
    
    .toggle-password {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: #9ca3af;
        font-size: 18px;
        transition: all 0.3s ease;
        z-index: 2;
    }
    
    .toggle-password:hover {
        color: #8e44ad;
    }
    
    .input-password {
        width: 100%;
        padding: 14px 45px 14px 48px;
        border: 2px solid #e9d9ff;
        border-radius: 18px;
        font-size: 15px;
        transition: all 0.3s ease;
        background: white;
    }
    
    .input-password:focus {
        border-color: #8e44ad;
        outline: none;
        box-shadow: 0 0 0 4px rgba(142, 68, 173, 0.1);
    }
    
    .input-password:hover {
        border-color: #c39bd3;
    }
    
    .input-password:focus + .input-icon-password {
        color: #8e44ad;
    }
    
    /* Floating Label */
    .floating-label {
        position: absolute;
        left: 48px;
        top: 50%;
        transform: translateY(-50%);
        background: white;
        padding: 0 5px;
        transition: all 0.2s ease;
        pointer-events: none;
        color: #9ca3af;
        font-size: 14px;
    }
    
    .input-password:focus ~ .floating-label,
    .input-password:not(:placeholder-shown) ~ .floating-label {
        top: 0;
        font-size: 11px;
        color: #8e44ad;
        background: white;
    }
    
    /* Match Message */
    .match-message {
        font-size: 12px;
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    
    .match-message.success {
        color: #22c55e;
    }
    
    .match-message.error {
        color: #ef4444;
    }
    
    /* Update Button */
    .btn-update-password {
        background: linear-gradient(135deg, #8e44ad, #a569bd);
        border: none;
        border-radius: 50px;
        padding: 14px;
        font-size: 16px;
        font-weight: 700;
        color: white;
        width: 100%;
        transition: all 0.3s ease;
        margin-top: 10px;
        box-shadow: 0 4px 15px rgba(142, 68, 173, 0.3);
        cursor: pointer;
    }
    
    .btn-update-password:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(142, 68, 173, 0.4);
    }
    
    .btn-update-password:active {
        transform: translateY(0);
    }
    
    .btn-update-password.loading {
        opacity: 0.7;
        pointer-events: none;
        position: relative;
    }
    
    .btn-update-password.loading::after {
        content: '';
        position: absolute;
        width: 18px;
        height: 18px;
        top: 50%;
        right: 25px;
        transform: translateY(-50%);
        border: 2px solid white;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
        to { transform: translateY(-50%) rotate(360deg); }
    }
    
    /* Alert Messages */
    .alert-password {
        border-radius: 16px;
        padding: 12px 16px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        animation: fadeInUp 0.3s ease-out;
    }
    
    .alert-error {
        background: linear-gradient(135deg, #fee2e2, #fecaca);
        color: #dc2626;
        border-left: 4px solid #ef4444;
    }
    
    .alert-success {
        background: linear-gradient(135deg, #dcfce7, #bbf7d0);
        color: #16a34a;
        border-left: 4px solid #22c55e;
    }
    
    /* Character Counter */
    .char-counter {
        font-size: 11px;
        color: #9ca3af;
        margin-top: 6px;
        text-align: right;
    }
    
    .char-counter.valid {
        color: #22c55e;
    }
    
    .char-counter.invalid {
        color: #ef4444;
    }
    
    /* Responsive */
    @media (max-width: 576px) {
        .password-body {
            padding: 25px;
        }
        
        .password-header {
            padding: 30px 20px;
        }
        
        .lock-icon {
            width: 65px;
            height: 65px;
        }
        
        .lock-icon i {
            font-size: 32px;
        }
        
        .input-password {
            padding: 12px 40px 12px 45px;
            font-size: 14px;
        }
    }
</style>

<div class="container py-5">
    <div class="password-container">
        <div class="password-card">
            
            <!-- Header -->
            <div class="password-header">
                <div class="lock-icon">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <h3>Change Password</h3>
                <p>Create a new secure password</p>
            </div>
            
            <!-- Body -->
            <div class="password-body">
                
                <form method="POST" id="passwordForm">
                    {% csrf_token %}
                    
                    <!-- Current Password -->
                    <div class="form-group-password">
                        <div class="input-wrapper-password">
                            <i class="bi bi-lock input-icon-password"></i>
                            <input type="password"
                                   class="input-password"
                                   id="currentPassword"
                                   name="old_password"
                                   placeholder=" "
                                   required>
                            <i class="bi bi-eye-slash toggle-password" data-target="currentPassword"></i>
                            <label class="floating-label">Current Password</label>
                        </div>
                    </div>
                    
                    <!-- New Password -->
                    <div class="form-group-password">
                        <div class="input-wrapper-password">
                            <i class="bi bi-key input-icon-password"></i>
                            <input type="password"
                                   class="input-password"
                                   id="newPassword"
                                   name="new_password"
                                   placeholder=" "
                                   required>
                            <i class="bi bi-eye-slash toggle-password" data-target="newPassword"></i>
                            <label class="floating-label">New Password</label>
                        </div>
                        <div class="char-counter" id="charCounter">
                            <i class="bi bi-info-circle"></i> At least 6 characters
                        </div>
                    </div>
                    
                    <!-- Confirm Password -->
                    <div class="form-group-password">
                        <div class="input-wrapper-password">
                            <i class="bi bi-check-circle input-icon-password"></i>
                            <input type="password"
                                   class="input-password"
                                   id="confirmPassword"
                                   name="confirm_password"
                                   placeholder=" "
                                   required>
                            <i class="bi bi-eye-slash toggle-password" data-target="confirmPassword"></i>
                            <label class="floating-label">Confirm New Password</label>
                        </div>
                        <div class="match-message" id="matchMessage"></div>
                    </div>
                    
                    <button type="submit" class="btn-update-password" id="submitBtn">
                        <i class="bi bi-check-lg"></i> Update Password
                    </button>
                    
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        const submitBtn = document.getElementById('submitBtn');
        const form = document.getElementById('passwordForm');
        const charCounter = document.getElementById('charCounter');
        const matchMessage = document.getElementById('matchMessage');
        
        // Toggle password visibility
        const toggleIcons = document.querySelectorAll('.toggle-password');
        toggleIcons.forEach(icon => {
            icon.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                const input = document.getElementById(targetId);
                if (input.type === 'password') {
                    input.type = 'text';
                    this.classList.remove('bi-eye-slash');
                    this.classList.add('bi-eye');
                } else {
                    input.type = 'password';
                    this.classList.remove('bi-eye');
                    this.classList.add('bi-eye-slash');
                }
            });
        });
        
        // Check password length (minimum 6 characters)
        function checkPasswordLength(password) {
            const isValid = password.length >= 6;
            
            if (password.length === 0) {
                charCounter.innerHTML = '<i class="bi bi-info-circle"></i> At least 6 characters';
                charCounter.classList.remove('valid', 'invalid');
            } else if (isValid) {
                charCounter.innerHTML = '<i class="bi bi-check-circle-fill"></i> Password is valid (6+ characters)';
                charCounter.classList.add('valid');
                charCounter.classList.remove('invalid');
            } else {
                charCounter.innerHTML = '<i class="bi bi-exclamation-circle-fill"></i> Needs at least 6 characters (currently ' + password.length + ')';
                charCounter.classList.add('invalid');
                charCounter.classList.remove('valid');
            }
            
            return isValid;
        }
        
        // Check password match
        function checkMatch() {
            const newPass = newPassword.value;
            const confirmPass = confirmPassword.value;
            
            if (confirmPass.length === 0) {
                matchMessage.innerHTML = '';
                matchMessage.className = 'match-message';
                return false;
            }
            
            if (newPass === confirmPass) {
                matchMessage.innerHTML = '<i class="bi bi-check-circle-fill"></i> Passwords match';
                matchMessage.className = 'match-message success';
                return true;
            } else {
                matchMessage.innerHTML = '<i class="bi bi-x-circle-fill"></i> Passwords do not match';
                matchMessage.className = 'match-message error';
                return false;
            }
        }
        
        // Real-time validation
        newPassword.addEventListener('input', function() {
            checkPasswordLength(this.value);
            checkMatch();
        });
        
        confirmPassword.addEventListener('input', checkMatch);
        
        // Form validation before submit
        form.addEventListener('submit', function(e) {
            const newPass = newPassword.value;
            const confirmPass = confirmPassword.value;
            let hasError = false;
            
            // Check minimum length (6 characters)
            if (newPass.length < 6) {
                e.preventDefault();
                hasError = true;
                charCounter.innerHTML = '<i class="bi bi-exclamation-circle-fill"></i> Password must be at least 6 characters';
                charCounter.classList.add('invalid');
                charCounter.classList.remove('valid');
                
                newPassword.style.animation = 'shake 0.3s ease';
                setTimeout(() => {
                    newPassword.style.animation = '';
                }, 300);
            }
            
            // Check if passwords match
            if (newPass !== confirmPass) {
                e.preventDefault();
                hasError = true;
                matchMessage.innerHTML = '<i class="bi bi-x-circle-fill"></i> Passwords do not match';
                matchMessage.className = 'match-message error';
                
                confirmPassword.style.animation = 'shake 0.3s ease';
                setTimeout(() => {
                    confirmPassword.style.animation = '';
                }, 300);
            }
            
            // Show loading state if no errors
            if (!hasError) {
                submitBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Updating...';
                submitBtn.classList.add('loading');
            }
        });
    });
</script>

{% endblock %}
