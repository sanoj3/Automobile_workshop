{% extends 'base.html' %}

{% block title %}Edit Profile{% endblock %}
{% block header %}Edit Profile{% endblock %}

{% block content %}

<div class="container py-3">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9">

            <div class="card border-0 shadow rounded-4 overflow-hidden">

                <!-- Top Banner -->
                <div class="bg-primary position-relative"
                     style="height:100px;">

                    <!-- Profile Image -->
                    <div class="position-absolute start-50 translate-middle"
                         style="bottom:-40px;">

                        <div class="rounded-circle bg-white shadow border border-3 border-white overflow-hidden"
                             style="width:85px;height:85px;">

                            {% if customer.profile_pic %}

                                <img src="{{ customer.profile_pic.url }}"
                                     class="w-100 h-100"
                                     style="object-fit:cover;">

                            {% else %}

                                <div class="bg-primary text-white d-flex align-items-center justify-content-center fw-bold h-100"
                                     style="font-size:28px;">

                                    {{ customer.name|slice:":1" }}

                                </div>

                            {% endif %}

                        </div>

                    </div>

                </div>

                <!-- Form Body -->
                <div class="card-body pt-5 mt-2 px-4">

                    <form method="POST"
                          enctype="multipart/form-data">

                        {% csrf_token %}

                        <!-- Name -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Full Name
                            </label>

                            <input type="text"
                                   name="name"
                                   class="form-control rounded-3"
                                   value="{{ customer.name }}"
                                   required>

                        </div>

                        <!-- Email -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Email
                            </label>

                            <input type="email"
                                   name="email"
                                   class="form-control rounded-3"
                                   value="{{ user.email }}"
                                   required>

                        </div>

                        <!-- Phone -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Phone Number
                            </label>

                            <input type="text"
                                   name="number"
                                   class="form-control rounded-3"
                                   value="{{ customer.number }}"
                                   required>

                        </div>

                        <!-- Address -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Address
                            </label>

                            <textarea name="address"
                                      rows="3"
                                      class="form-control rounded-3"
                                      required>{{ customer.address }}</textarea>

                        </div>

                        <!-- Profile Picture -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Profile Picture
                            </label>

                            <input type="file"
                                   name="profile_pic"
                                   class="form-control rounded-3">

                        </div>

                        <!-- Buttons -->
                        <div class="d-flex justify-content-center gap-2">

                            <button type="submit"
                                    class="btn btn-primary rounded-pill px-4">

                                <i class="bi bi-check-circle"></i>
                                Update

                            </button>

                            <a href="{% url 'profile_user' %}"
                               class="btn btn-outline-dark rounded-pill px-4">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
