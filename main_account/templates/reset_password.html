<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>FixiGo | Reset Password</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1E1B2E 0%, #2D1B4E 50%, #1A1030 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background orbs */
        body::before {
            content: '';
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.15) 0%, rgba(124, 58, 237, 0) 70%);
            top: -200px;
            left: -200px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatOrb 12s ease-in-out infinite alternate;
        }

        body::after {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.12) 0%, rgba(168, 85, 247, 0) 70%);
            bottom: -250px;
            right: -250px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatOrb 15s ease-in-out infinite alternate-reverse;
        }

        @keyframes floatOrb {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, 30px) scale(1.1);
            }
        }

        .reset-wrapper {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 2;
            animation: fadeUp 0.6s ease-out;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reset-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 48px;
            padding: 48px 40px 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(167, 139, 250, 0.2);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .reset-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(167, 139, 250, 0.3);
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(145deg, #4C1D95, #7C3AED);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .logo-icon:hover {
            transform: rotate(-6deg) scale(1.05);
        }

        .logo-icon i {
            font-size: 40px;
            color: white;
        }

        .reset-title {
            font-size: 30px;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(135deg, #4C1D95, #A855F7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .reset-subtitle {
            text-align: center;
            color: #6B7280;
            font-size: 15px;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .reset-subtitle strong {
            color: #4C1D95;
        }

        .form-label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-label i {
            color: #A855F7;
        }

        .password-wrapper {
            position: relative;
            transition: all 0.3s ease;
        }

        .password-wrapper .form-control {
            height: 56px;
            border-radius: 20px;
            border: 1.5px solid #E5E7EB;
            padding-left: 20px;
            padding-right: 52px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #FAFAFA;
        }

        .password-wrapper .form-control:focus {
            border-color: #A855F7;
            box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.15);
            background: white;
            outline: none;
        }

        .password-wrapper .form-control.is-invalid {
            border-color: #dc2626;
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.12);
        }

        .password-wrapper .form-control.is-valid {
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12);
        }

        .password-wrapper .form-control::placeholder {
            color: #9CA3AF;
            font-weight: 400;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 18px;
            transform: translateY(-50%);
            cursor: pointer;
            color: #9CA3AF;
            font-size: 20px;
            transition: color 0.3s ease, transform 0.2s ease;
            background: transparent;
            border: none;
            padding: 4px;
            z-index: 2;
        }

        .toggle-password:hover {
            color: #7C3AED;
            transform: translateY(-50%) scale(1.1);
        }

        .toggle-password:active {
            transform: translateY(-50%) scale(0.9);
        }

        .invalid-feedback {
            font-size: 12px;
            margin-top: 8px;
            color: #dc2626;
            display: flex;
            align-items: center;
            gap: 6px;
            display: none;
            animation: shake 0.4s ease;
        }

        .invalid-feedback.show {
            display: flex;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-6px);
            }
            75% {
                transform: translateX(6px);
            }
        }

        /* Password strength indicator */
        .password-strength {
            margin-top: 10px;
            display: flex;
            gap: 6px;
            align-items: center;
            height: 6px;
        }

        .strength-bar {
            flex: 1;
            height: 6px;
            border-radius: 4px;
            background: #E5E7EB;
            transition: all 0.4s ease;
        }

        .strength-bar.active.weak {
            background: #dc2626;
        }
        .strength-bar.active.medium {
            background: #f59e0b;
        }
        .strength-bar.active.strong {
            background: #10b981;
        }

        .strength-text {
            font-size: 11px;
            font-weight: 600;
            min-width: 60px;
            text-align: right;
            color: #6B7280;
            transition: color 0.3s ease;
        }

        .strength-text.weak {
            color: #dc2626;
        }
        .strength-text.medium {
            color: #f59e0b;
        }
        .strength-text.strong {
            color: #10b981;
        }

        .btn-change {
            width: 100%;
            height: 56px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(95deg, #7C3AED, #A855F7);
            color: white;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 24px -6px #7C3AED80;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            margin-top: 8px;
        }

        .btn-change:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 14px 32px -8px #6D28D9;
            background: linear-gradient(95deg, #6D28D9, #9333EA);
        }

        .btn-change:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-change:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-change .spinner-border {
            width: 20px;
            height: 20px;
            border-width: 2.5px;
        }

        .btn-change .btn-content {
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .btn-change.loading .btn-content {
            opacity: 0.7;
        }

        .error-message {
            background: #FEF2F2;
            border: 1px solid #FECACA;
            border-radius: 16px;
            padding: 14px 18px;
            color: #991B1B;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
            animation: fadeUp 0.4s ease;
        }

        .error-message i {
            font-size: 20px;
            color: #dc2626;
        }

        .back-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
            color: #6B7280;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.3s ease;
            padding: 10px;
            border-radius: 16px;
        }

        .back-link:hover {
            color: #7C3AED;
            background: rgba(124, 58, 237, 0.06);
        }

        .back-link i {
            font-size: 18px;
            transition: transform 0.3s ease;
        }

        .back-link:hover i {
            transform: translateX(-4px);
        }

        .footer-note {
            text-align: center;
            margin-top: 28px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }

        .footer-note a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-note a:hover {
            color: #C4B5FD;
        }

        @media(max-width: 480px) {
            .reset-card {
                padding: 32px 24px 28px;
                border-radius: 32px;
            }
            .reset-title {
                font-size: 24px;
            }
            .reset-subtitle {
                font-size: 14px;
            }
            .password-wrapper .form-control {
                height: 50px;
                font-size: 14px;
                padding-right: 46px;
            }
            .btn-change {
                height: 50px;
                font-size: 15px;
            }
            .strength-text {
                font-size: 10px;
                min-width: 50px;
            }
        }
    </style>
</head>
<body>

    <div class="reset-wrapper">
        <div class="reset-card">

            <!-- Logo -->
            <div class="logo-icon">
                <i class="bi bi-key-fill"></i>
            </div>

            <!-- Title -->
            <h2 class="reset-title">Reset Password</h2>
            <p class="reset-subtitle">
                Create a <strong>strong</strong> new password for your account.
            </p>

            <!-- Form -->
            <form method="POST" id="resetForm" novalidate>
                {% csrf_token %}

                <!-- New Password -->
                <div class="mb-3">
                    <label class="form-label">
                        <i class="bi bi-lock-fill"></i> New Password
                    </label>
                    <div class="password-wrapper">
                        <input
                        type="password"
                        name="password"
                        id="passwordInput"
                        class="form-control"
                        placeholder="Create a strong password"
                        required
                        minlength="8"
                        autocomplete="new-password"
                        />
                        <button type="button" class="toggle-password" onclick="togglePassword('passwordInput', 'eyeIcon1')" tabindex="-1">
                            <i class="bi bi-eye-fill" id="eyeIcon1"></i>
                        </button>
                        <div class="invalid-feedback" id="passwordFeedback">
                            <i class="bi bi-exclamation-circle"></i>
                            Password must be at least 8 characters
                        </div>
                    </div>

                    <!-- Password Strength -->
                    <div class="password-strength">
                        <span class="strength-text" id="strengthText">Weak</span>
                        <span class="strength-bar" id="bar1"></span>
                        <span class="strength-bar" id="bar2"></span>
                        <span class="strength-bar" id="bar3"></span>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="mb-4">
                    <label class="form-label">
                        <i class="bi bi-check-circle"></i> Confirm Password
                    </label>
                    <div class="password-wrapper">
                        <input
                        type="password"
                        name="confirm"
                        id="confirmInput"
                        class="form-control"
                        placeholder="Confirm your password"
                        required
                        autocomplete="new-password"
                        />
                        <button type="button" class="toggle-password" onclick="togglePassword('confirmInput', 'eyeIcon2')" tabindex="-1">
                            <i class="bi bi-eye-fill" id="eyeIcon2"></i>
                        </button>
                        <div class="invalid-feedback" id="confirmFeedback">
                            <i class="bi bi-exclamation-circle"></i>
                            Passwords do not match
                        </div>
                    </div>
                </div>

                <!-- Error Display (from Django) -->
                {% if error %}
                <div class="error-message" id="errorDisplay">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span>{{ error }}</span>
                </div>
                {% endif %}

                <!-- Change Button -->
                <button type="submit" id="submitBtn" class="btn-change">
                    <span class="btn-content">
                        <i class="bi bi-arrow-clockwise"></i>
                        Change Password
                    </span>
                </button>

                <!-- Back to Login -->
                <a href="{% url 'login' %}" class="back-link text-decoration-none">
                    <i class="bi bi-arrow-left"></i>
                    Back to Login
                </a>
            </form>

        </div>

        <!-- Footer -->
        <div class="footer-note">
            <span>© 2026 <strong>FixiGo</strong> — All Rights Reserved.</span>
            <!-- &nbsp;·&nbsp;
            <a href="#">Privacy</a>
            &nbsp;·&nbsp;
            <a href="#">Support</a> -->
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script>
        (function() {
            const form = document.getElementById('resetForm');
            const passwordInput = document.getElementById('passwordInput');
            const confirmInput = document.getElementById('confirmInput');
            const submitBtn = document.getElementById('submitBtn');
            const passwordFeedback = document.getElementById('passwordFeedback');
            const confirmFeedback = document.getElementById('confirmFeedback');
            const errorDisplay = document.getElementById('errorDisplay');

            // Strength bars
            const bar1 = document.getElementById('bar1');
            const bar2 = document.getElementById('bar2');
            const bar3 = document.getElementById('bar3');
            const strengthText = document.getElementById('strengthText');

            // --- Toggle Password Visibility ---
            window.togglePassword = function(inputId, iconId) {
                const input = document.getElementById(inputId);
                const icon = document.getElementById(iconId);
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('bi-eye-fill');
                    icon.classList.add('bi-eye-slash-fill');
                } else {
                    input.type = 'password';
                    icon.classList.remove('bi-eye-slash-fill');
                    icon.classList.add('bi-eye-fill');
                }
            };

            // --- Password Strength ---
            function checkStrength(password) {
                let score = 0;
                if (password.length >= 8) score++;
                if (password.length >= 12) score++;
                if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
                if (/\d/.test(password)) score++;
                if (/[^a-zA-Z0-9]/.test(password)) score++;

                // Map score to strength
                if (score <= 2) return { level: 'weak', label: 'Weak', score: 0 };
                if (score <= 3) return { level: 'medium', label: 'Medium', score: 1 };
                if (score <= 4) return { level: 'strong', label: 'Strong', score: 2 };
                return { level: 'strong', label: 'Strong', score: 3 };
            }

            function updateStrength() {
                const password = passwordInput.value;
                const result = checkStrength(password);

                // Reset bars
                [bar1, bar2, bar3].forEach(bar => {
                    bar.className = 'strength-bar';
                });

                if (password.length === 0) {
                    strengthText.textContent = '';
                    strengthText.className = 'strength-text';
                    return;
                }

                // Set active bars based on score
                const bars = [bar1, bar2, bar3];
                const activeCount = Math.min(result.score + 1, 3);
                for (let i = 0; i < activeCount; i++) {
                    bars[i].classList.add('active', result.level);
                }

                strengthText.textContent = result.label;
                strengthText.className = 'strength-text ' + result.level;
            }

            // --- Validation ---
            function validatePassword() {
                const value = passwordInput.value;
                const isValid = value.length >= 8;

                if (value.length === 0) {
                    passwordInput.classList.remove('is-valid', 'is-invalid');
                    passwordFeedback.classList.remove('show');
                    return false;
                }

                if (isValid) {
                    passwordInput.classList.remove('is-invalid');
                    passwordInput.classList.add('is-valid');
                    passwordFeedback.classList.remove('show');
                    return true;
                } else {
                    passwordInput.classList.remove('is-valid');
                    passwordInput.classList.add('is-invalid');
                    passwordFeedback.classList.add('show');
                    return false;
                }
            }

            function validateConfirm() {
                const password = passwordInput.value;
                const confirm = confirmInput.value;
                const isValid = password === confirm && password.length > 0;

                if (confirm.length === 0) {
                    confirmInput.classList.remove('is-valid', 'is-invalid');
                    confirmFeedback.classList.remove('show');
                    return false;
                }

                if (isValid) {
                    confirmInput.classList.remove('is-invalid');
                    confirmInput.classList.add('is-valid');
                    confirmFeedback.classList.remove('show');
                    return true;
                } else {
                    confirmInput.classList.remove('is-valid');
                    confirmInput.classList.add('is-invalid');
                    confirmFeedback.classList.add('show');
                    return false;
                }
            }

            function validateAll() {
                const isPassValid = validatePassword();
                const isConfirmValid = validateConfirm();
                return isPassValid && isConfirmValid;
            }

            // --- Event Listeners ---
            passwordInput.addEventListener('input', function() {
                if (errorDisplay) errorDisplay.style.display = 'none';
                validatePassword();
                updateStrength();
                validateConfirm();
                // Enable/disable submit
                submitBtn.disabled = !validateAll();
            });

            passwordInput.addEventListener('blur', function() {
                validatePassword();
                validateConfirm();
                submitBtn.disabled = !validateAll();
            });

            confirmInput.addEventListener('input', function() {
                if (errorDisplay) errorDisplay.style.display = 'none';
                validateConfirm();
                submitBtn.disabled = !validateAll();
            });

            confirmInput.addEventListener('blur', function() {
                validateConfirm();
                submitBtn.disabled = !validateAll();
            });

            // --- Form Submit ---
            form.addEventListener('submit', function(e) {
                const isValid = validateAll();

                if (!isValid) {
                    e.preventDefault();
                    if (passwordInput.value.length < 8) {
                        passwordInput.focus();
                    } else if (confirmInput.value.length === 0 || passwordInput.value !== confirmInput.value) {
                        confirmInput.focus();
                    }
                    return;
                }

                // Show loading state
                submitBtn.disabled = true;
                submitBtn.classList.add('loading');
                submitBtn.innerHTML = `
                        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                        Changing Password...
                    `;

                if (errorDisplay) errorDisplay.style.display = 'none';
            });

            // --- Handle Django errors ---
            if (errorDisplay) {
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
                submitBtn.innerHTML = `
                        <span class="btn-content">
                            <i class="bi bi-arrow-clockwise"></i>
                            Change Password
                        </span>
                    `;
                errorDisplay.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            // --- Initial state ---
            updateStrength();
            submitBtn.disabled = true;

            // Auto-focus
            setTimeout(() => {
                passwordInput.focus();
            }, 400);

            // --- Prevent paste into confirm if not matching? No, let it validate ---

            // --- Additional: if password field is valid, show strength ---
            // Already handled

        })();
    </script>

</body>
</html>
