{% extends 'base_mechanic.html' %}

{% block title %}Edit Profile{% endblock %}
{% block header %}Edit Profile{% endblock %}

{% block content %}

<style>
    .edit-wrap {
        max-width: 580px;
        margin: 0 auto;
    }

    .edit-card {
        background: white;
        border-radius: 20px;
        padding: 35px 30px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        border: 1px solid #efe8f5;
    }

    /* Header */
    .edit-head {
        text-align: center;
        margin-bottom: 30px;
    }

    .edit-head h2 {
        font-size: 22px;
        font-weight: 700;
        color: #1e1b2a;
        margin: 0 0 4px;
    }

    .edit-head p {
        color: #8a8598;
        font-size: 14px;
        margin: 0;
    }

    /* Avatar Center */
    .avatar-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 30px;
    }

    .avatar-wrap {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        overflow: hidden;
        border: 3px solid #d5cce0;
        background: #f4f0f8;
        position: relative;
        cursor: pointer;
        transition: 0.3s;
    }

    .avatar-wrap:hover {
        border-color: #8e44ad;
        transform: scale(1.02);
    }

    .avatar-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .avatar-wrap .initials {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        font-weight: 700;
        color: #6a4b7a;
    }

    .avatar-wrap .camera-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(0,0,0,0.5);
        color: white;
        font-size: 18px;
        padding: 6px 0;
        text-align: center;
        opacity: 0;
        transition: 0.3s;
    }

    .avatar-wrap:hover .camera-overlay {
        opacity: 1;
    }

    .avatar-label {
        font-size: 12px;
        color: #8a8598;
        margin-top: 8px;
    }

    .file-input-hidden {
        display: none;
    }

    /* Form */
    .field {
        margin-bottom: 18px;
    }

    .field label {
        display: block;
        font-weight: 500;
        font-size: 13px;
        color: #1e1b2a;
        margin-bottom: 5px;
    }

    .field input {
        width: 100%;
        padding: 10px 14px;
        border: 1.5px solid #e4dcec;
        border-radius: 10px;
        font-size: 14px;
        background: #faf8fc;
        transition: 0.2s;
    }

    .field input:focus {
        outline: none;
        border-color: #8e44ad;
        background: white;
        box-shadow: 0 0 0 3px rgba(142,68,173,0.06);
    }

    /* Buttons */
    .btn-group {
        display: flex;
        gap: 12px;
        margin-top: 6px;
    }

    .btn-primary {
        flex: 1;
        background: #8e44ad;
        color: white;
        padding: 10px;
        border: none;
        border-radius: 50px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }

    .btn-primary:hover {
        background: #7d3c98;
        transform: translateY(-1px);
    }

    .btn-secondary {
        flex: 1;
        background: transparent;
        color: #6a4b7a;
        padding: 10px;
        border: 1.5px solid #e4dcec;
        border-radius: 50px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: 0.2s;
        text-decoration: none;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }

    .btn-secondary:hover {
        background: #f4f0f8;
        border-color: #c9bcd8;
    }

    @media (max-width: 480px) {
        .edit-card {
            padding: 25px 20px;
        }

        .btn-group {
            flex-direction: column;
        }

        .avatar-wrap {
            width: 80px;
            height: 80px;
        }
    }
</style>

<div class="edit-wrap">
    <div class="edit-card">

        <!-- Header -->
        <div class="edit-head">
            <h2>Edit Profile</h2>
            <p>Update your account information</p>
        </div>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Avatar -->
            <div class="avatar-center">
                <label for="fileInput" class="avatar-wrap">
                    {% if mechanic.profile_pic %}
                        <img src="{{ mechanic.profile_pic.url }}" id="avatarPreview" alt="Profile">
                    {% else %}
                        <div class="initials" id="avatarInitials">{{ mechanic.name|slice:":1"|upper }}</div>
                    {% endif %}
                    <div class="camera-overlay">
                        <i class="bi bi-camera"></i>
                    </div>
                </label>
                <span class="avatar-label">Click photo to change</span>
                <input type="file" name="profile_pic" id="fileInput" class="file-input-hidden" accept="image/*">
            </div>

            <!-- Email -->
            <div class="field">
                <label><i class="bi bi-envelope"></i> Email</label>
                <input type="email" name="email" value="{{ mechanic.email }}" required>
            </div>

            <!-- Phone -->
            <div class="field">
                <label><i class="bi bi-phone"></i> Phone</label>
                <input type="text" name="number" value="{{ mechanic.number }}" required>
            </div>

            <!-- Buttons -->
            <div class="btn-group">
                <button type="submit" class="btn-primary">
                    <i class="bi bi-check-lg"></i> Save
                </button>
                <a href="{% url 'profile_page_mechanic' %}" class="btn-secondary">
                    <i class="bi bi-x-lg"></i> Cancel
                </a>
            </div>

        </form>

    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const fileInput = document.getElementById('fileInput');
        const avatarWrap = document.querySelector('.avatar-wrap');
        const avatarPreview = document.getElementById('avatarPreview');
        const avatarInitials = document.getElementById('avatarInitials');

        avatarWrap.addEventListener('click', function() {
            fileInput.click();
        });

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    if (avatarPreview) {
                        avatarPreview.src = event.target.result;
                    } else {
                        const img = document.createElement('img');
                        img.id = 'avatarPreview';
                        img.src = event.target.result;
                        img.style.width = '100%';
                        img.style.height = '100%';
                        img.style.objectFit = 'cover';
                        if (avatarInitials) avatarInitials.style.display = 'none';
                        avatarWrap.insertBefore(img, avatarWrap.querySelector('.camera-overlay'));
                    }
                };
                reader.readAsDataURL(file);
            }
        });

        const phoneInput = document.querySelector('input[name="number"]');
        if (phoneInput) {
            phoneInput.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9+]/g, '');
            });
        }
    });
</script>

{% endblock %}
