<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Application Rejected</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">

            <div class="card shadow border-0 rounded-4 text-center p-5">

                <div class="mb-4">
                    <i class="bi bi-x-circle-fill text-danger display-1"></i>
                </div>

                <h2 class="fw-bold mb-3 text-danger">
                    Application Rejected
                </h2>

                <p class="text-muted">
                    Your mechanic application has been rejected by the admin.
                    Please contact support or apply again later.
                </p>

                <!-- Logout Button -->
                <a href="{% url 'logout_view_mechanic' %}" class="btn btn-danger mt-3">
                    Logout
                </a>

            </div>

        </div>
    </div>
</div>

</body>
</html>
