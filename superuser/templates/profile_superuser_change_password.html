{% extends 'base_admin.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-4 col-md-6">

            <div class="modern-card">

                <!-- Top -->
                <div class="text-center mb-4">

                    <div class="top-icon">
                        <i class="bi bi-lock"></i>
                    </div>

                    <h3 class="fw-bold mt-3">
                        Reset Password
                    </h3>

                    <p class="text-muted small">
                        Create a new secure password
                    </p>

                </div>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} rounded-3">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST">

                    {% csrf_token %}

                    <!-- Old -->
                    <div class="form-floating mb-3">

                        <input type="password"
                               class="form-control custom-input"
                               id="oldPassword"
                               name="old_password"
                               placeholder="Old Password"
                               required>

                        <label for="oldPassword">
                            Old Password
                        </label>

                    </div>

                    <!-- New -->
                    <div class="form-floating mb-3">

                        <input type="password"
                               class="form-control custom-input"
                               id="newPassword"
                               name="new_password"
                               placeholder="New Password"
                               required>

                        <label for="newPassword">
                            New Password
                        </label>

                    </div>

                    <!-- Confirm -->
                    <div class="form-floating mb-4">

                        <input type="password"
                               class="form-control custom-input"
                               id="confirmPassword"
                               name="confirm_password"
                               placeholder="Confirm Password"
                               required>

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                    </div>

                    <button type="submit"
                            class="btn btn-main w-100">

                        Update Password

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

<style>

body{
    background:#eef2f7;
}

.modern-card{
    background:white;
    padding:40px 30px;
    border-radius:24px;
    box-shadow:0 15px 40px rgba(0,0,0,0.08);
}

.top-icon{
    width:75px;
    height:75px;
    background:#0d6efd;
    color:white;
    border-radius:20px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    box-shadow:0 10px 20px rgba(13,110,253,0.25);
}

.custom-input{
    border-radius:16px;
    border:1px solid #dbe1ea;
    height:58px;
    box-shadow:none !important;
}

.custom-input:focus{
    border-color:#0d6efd;
}

.form-floating label{
    padding-left:18px;
}

.btn-main{
    background:#0d6efd;
    color:white;
    border:none;
    height:55px;
    border-radius:16px;
    font-weight:600;
    font-size:16px;
    transition:0.3s;
}

.btn-main:hover{
    background:#0b5ed7;
    color:white;
    transform:translateY(-2px);
}

</style>

{% endblock %}
