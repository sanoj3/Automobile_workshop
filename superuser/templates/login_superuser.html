<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superadmin Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
            background:#f4f7fb;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:'Segoe UI',sans-serif;
            padding:20px;
        }

        .login-container{
            width:100%;
            max-width:950px;
            background:#fff;
            border-radius:25px;
            overflow:hidden;
            box-shadow:0 15px 40px rgba(0,0,0,0.08);
            display:grid;
            grid-template-columns:1fr 1fr;
        }

        /* LEFT SIDE */
        .left-side{
            background:linear-gradient(135deg,#2563eb,#4f46e5);
            color:white;
            padding:60px 40px;
            display:flex;
            flex-direction:column;
            justify-content:center;
        }

        .left-side i{
            font-size:90px;
            margin-bottom:25px;
        }

        .left-side h1{
            font-size:42px;
            font-weight:700;
            margin-bottom:15px;
        }

        .left-side p{
            font-size:16px;
            opacity:0.9;
            line-height:1.7;
        }

        /* RIGHT SIDE */
        .right-side{
            padding:60px 45px;
            display:flex;
            flex-direction:column;
            justify-content:center;
        }

        .login-title{
            font-size:32px;
            font-weight:700;
            margin-bottom:8px;
            color:#111827;
        }

        .login-subtitle{
            color:#6b7280;
            margin-bottom:35px;
        }

        .form-label{
            font-weight:600;
            margin-bottom:8px;
            color:#374151;
        }

        .form-control{
            height:52px;
            border-radius:14px;
            border:1px solid #d1d5db;
            padding-left:15px;
            transition:0.3s;
        }

        .form-control:focus{
            border-color:#2563eb;
            box-shadow:none;
        }

        .password-wrapper{
            position:relative;
        }

        .toggle-password{
            position:absolute;
            top:50%;
            right:18px;
            transform:translateY(-50%);
            cursor:pointer;
            color:#6b7280;
            font-size:18px;
        }

        .btn-login{
            width:100%;
            height:52px;
            border:none;
            border-radius:14px;
            background:linear-gradient(135deg,#2563eb,#4f46e5);
            color:white;
            font-size:16px;
            font-weight:600;
            transition:0.3s;
        }

        .btn-login:hover{
            transform:translateY(-2px);
            opacity:0.95;
        }

        .toast{
            border-radius:12px;
        }

        @media(max-width:768px){
            .login-container{
                grid-template-columns:1fr;
            }

            .left-side{
                display:none;
            }

            .right-side{
                padding:40px 25px;
            }
        }

    </style>
</head>

<body>

<!-- Messages -->
{% if messages %}
<div class="position-fixed top-0 end-0 p-3" style="z-index:9999;">

    {% for message in messages %}

    <div class="toast show align-items-center text-white
        {% if message.tags == 'error' %}bg-danger
        {% elif message.tags == 'warning' %}bg-warning
        {% else %}bg-success{% endif %}
        border-0 mb-2 shadow">

        <div class="d-flex">

            <div class="toast-body">
                {{ message }}
            </div>

            <button type="button" class="btn-close btn-close-white me-2 m-auto"></button>

        </div>

    </div>

    {% endfor %}

</div>
{% endif %}

<script>
setTimeout(() => {
    document.querySelectorAll('.toast').forEach(t => t.remove());
}, 3000);
</script>

<!-- LOGIN -->
<div class="login-container">

    <!-- LEFT -->
    <div class="left-side">

        <i class="bi bi-shield-lock-fill"></i>

        <h1>Superadmin Panel</h1>

        <p>
            Secure access to system administration.
            Manage users, mechanics, bookings, and full platform control.
        </p>

    </div>

    <!-- RIGHT -->
    <div class="right-side">

        <h2 class="login-title">Welcome Admin 👋</h2>
        <p class="login-subtitle">Login to continue</p>

        <form method="POST" action="{% url 'login_superuser' %}">
            {% csrf_token %}

            <!-- Username -->
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            </div>

            <!-- Password -->
            <div class="mb-4">
                <label class="form-label">Password</label>

                <div class="password-wrapper">
                    <input type="password" name="password" id="password" class="form-control pe-5"
                           placeholder="Enter password" required>

                    <!-- Eye Icon -->
                    <span class="toggle-password" onclick="togglePassword()">
                        <i class="bi bi-eye-fill" id="eyeIcon"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn-login">
                <i class="bi bi-box-arrow-in-right me-1"></i>
                Login
            </button>

        </form>

    </div>

</div>

<!-- PASSWORD TOGGLE SCRIPT -->
<script>

function togglePassword(){

    const password = document.getElementById("password");
    const eyeIcon = document.getElementById("eyeIcon");

    if(password.type === "password"){
        password.type = "text";
        eyeIcon.classList.replace("bi-eye-fill","bi-eye-slash-fill");
    } 
    else{
        password.type = "password";
        eyeIcon.classList.replace("bi-eye-slash-fill","bi-eye-fill");
    }
}

</script>

</body>
</html>
